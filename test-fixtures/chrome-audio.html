<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>stfu Chrome audio test</title>
</head>
<body>
  <button id="play">Play tone</button>
  <audio id="tone" controls loop></audio>
  <script>
    const params = new URLSearchParams(window.location.search);
    const title = params.get("title");
    if (title) {
      document.title = title;
    }

    function wavDataUri() {
      const sampleRate = 44100;
      const duration = 2;
      const samples = sampleRate * duration;
      const bytes = new ArrayBuffer(44 + samples * 2);
      const view = new DataView(bytes);
      const text = (offset, value) => {
        for (let i = 0; i < value.length; i += 1) {
          view.setUint8(offset + i, value.charCodeAt(i));
        }
      };
      text(0, "RIFF");
      view.setUint32(4, 36 + samples * 2, true);
      text(8, "WAVEfmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      text(36, "data");
      view.setUint32(40, samples * 2, true);
      for (let i = 0; i < samples; i += 1) {
        const sample = Math.sin((i / sampleRate) * Math.PI * 2 * 440) * 0.01;
        view.setInt16(44 + i * 2, sample * 32767, true);
      }
      let binary = "";
      const data = new Uint8Array(bytes);
      for (let i = 0; i < data.length; i += 1) {
        binary += String.fromCharCode(data[i]);
      }
      return "data:audio/wav;base64," + btoa(binary);
    }

    const audio = document.querySelector("#tone");
    audio.src = wavDataUri();
    document.querySelector("#play").addEventListener("click", () => {
      audio.play();
    });
    audio.play().catch(() => {});
  </script>
</body>
</html>
